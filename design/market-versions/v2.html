<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klaro Market · V2 Shelves</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="klaro.css">
<link rel="stylesheet" href="market.css">
<style>
/* V2: shelves. A featured course up top that changes on its own, then rows to scroll through. */
.feature { position: relative; margin-top: 24px; border-radius: var(--r-large); overflow: hidden; height: clamp(380px, 46vw, 500px); background: var(--ink); }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s var(--ease-out); }
.slide.on { opacity: 1; }
.slide img { width: 100%; height: 100%; object-fit: cover; scale: 1.06; transition: scale 6s linear; }
.slide.on img { scale: 1; }
.slide .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(18 14 26 / .82), rgb(18 14 26 / .5) 45%, rgb(18 14 26 / 0) 75%); }
[dir="rtl"] .slide .shade { background: linear-gradient(-90deg, rgb(18 14 26 / .82), rgb(18 14 26 / .5) 45%, rgb(18 14 26 / 0) 75%); }
.slide .copy { position: absolute; inset-block: 0; inset-inline-start: 0; width: min(560px, 100%); padding: clamp(24px, 4vw, 48px); display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; color: #fff; }
.slide .copy > * { translate: 0 14px; opacity: 0; transition: translate .7s var(--ease-settle), opacity .5s; }
.slide.on .copy > * { translate: 0 0; opacity: 1; }
.slide.on .copy > *:nth-child(2) { transition-delay: .06s; } .slide.on .copy > *:nth-child(3) { transition-delay: .12s; } .slide.on .copy > *:nth-child(4) { transition-delay: .18s; } .slide.on .copy > *:nth-child(5) { transition-delay: .24s; }
.slide h2 { font-weight: 600; font-size: clamp(34px, 4.6vw, 56px); letter-spacing: -.05em; line-height: 1.02; }
.slide p { color: rgb(255 255 255 / .8); max-width: 30em; }
.slide .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.slide .price b { color: #fff; font-size: 22px; } .slide .price span { color: rgb(255 255 255 / .7); }
.slide .acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-ghost { background: rgb(255 255 255 / .14); color: #fff; border-color: rgb(255 255 255 / .25); backdrop-filter: blur(6px); }
.btn-ghost:hover { background: rgb(255 255 255 / .24); }
.dots { position: absolute; inset-block-end: 22px; inset-inline-end: 24px; display: flex; gap: 6px; z-index: 2; padding: 7px 9px; border-radius: 999px; background: rgb(18 14 26 / .4); backdrop-filter: blur(6px); }
.dots button { width: 34px; height: 5px; border-radius: 3px; border: 0; padding: 0; background: rgb(255 255 255 / .3); cursor: pointer; overflow: hidden; position: relative; }
.dots button i { position: absolute; inset: 0; background: #fff; transform-origin: left; scale: 0 1; }
[dir="rtl"] .dots button i { transform-origin: right; }
.dots button.on i { animation: fillx 6s linear forwards; }
.feature:hover .dots button.on i, .feature:focus-within .dots button.on i { animation-play-state: paused; }
@keyframes fillx { to { scale: 1 1; } }
.shelf { margin-top: 44px; }
.shelf-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.shelf-head h2 { font-weight: 600; font-size: 22px; letter-spacing: -.03em; }
.arrows { display: flex; gap: 6px; }
.arrows button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--card); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; transition: background-color .15s, color .15s; }
.arrows button:hover { background: var(--purple-tint); color: var(--purple-dark); border-color: var(--purple-line); }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, calc((100% - 54px) / 4)); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding-block: 6px 12px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row > * { scroll-snap-align: start; }
.tutorrow { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-block: 4px; }
.tutorchip { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border-radius: var(--r-pill); background: var(--card); border: 1px solid var(--border); cursor: pointer; font: 600 13px/1.2 var(--font); color: var(--ink); white-space: nowrap; transition: border-color .15s, translate .15s; }
.tutorchip:hover { border-color: var(--purple-line); translate: 0 -2px; }
.tutorchip[aria-pressed="true"] { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-soft); }
.tutorchip small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.pubhead { padding-top: 40px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
@media (max-width: 640px) { .row { grid-auto-columns: 80%; } .arrows { display: none; } .feature { height: 460px; border-radius: 20px; } .slide .shade { background: linear-gradient(to top, rgb(18 14 26 / .88), rgb(18 14 26 / .45) 60%, rgb(18 14 26 / .1)); } .dots { inset-block-start: 18px; inset-block-end: auto; } }
</style>
</head>
<body>
<main id="top" class="wrap" style="padding-bottom: 80px">
  <div class="pubhead pub-only">
    <div style="display: flex; flex-direction: column; gap: 8px"><span class="kicker">Klaro Market</span><h1 class="h2">Pick a course. Start tonight.</h1></div>
    <span class="example">Example courses, tutors and prices</span>
  </div>
  <div class="pagehead app-only" style="padding-bottom: 0">
    <div><span class="kicker">Market</span><h1 class="title">Market</h1><p class="lead">New courses from Klaro tutors. Enroll, and they join your Courses page.</p></div>
  </div>

  <section class="feature" id="feature" aria-roledescription="carousel" aria-label="Featured courses"></section>

  <section class="shelf reveal">
    <div class="shelf-head"><div><span class="kicker">Learn with a tutor</span><h2>Tutors on Klaro</h2></div></div>
    <div class="tutorrow" id="tutors"></div>
  </section>

  <div id="shelves"></div>
</main>
<script src="market.js"></script>
<script>
(function () {
  var featured = ['math-0580', 'sat-math', 'bio-0610', 'phys-9702'].map(function (id) { return KM.COURSES.filter(function (c) { return c.id === id; })[0]; });
  var blurbs = { 'math-0580': 'The whole syllabus in 30 lectures, with a past paper after every topic.', 'sat-math': 'Twenty lectures and fourteen timed quizzes, built around the digital SAT.', 'bio-0610': 'Each lecture opens beside the textbook page it covers.', 'phys-9702': 'Worked examples first, then the questions examiners actually ask.' };
  var feat = document.getElementById('feature'), cur = 0, timer;
  feat.innerHTML = featured.map(function (c, i) {
    var t = KM.TUTORS[c.tutor];
    return '<div class="slide' + (i ? '' : ' on') + '" aria-roledescription="slide" aria-label="' + (i + 1) + ' of 4"><img src="' + c.img + '" alt=""><div class="shade"></div>' +
      '<div class="copy"><span class="kicker" style="color: rgb(255 255 255 / .75)">' + c.level + ' · ' + c.year + (c.flag ? ' · ' + c.flag : '') + '</span><h2>' + c.title + '</h2><p>' + blurbs[c.id] + '</p>' +
      '<div class="who">' + KM.avatar(t, 30) + t.name + '</div>' +
      '<div class="acts">' + KM.priceHTML(c) + '<button class="btn btn-primary btn-lg" type="button" data-course="' + c.id + '">Enroll</button><button class="btn btn-ghost btn-lg" type="button" data-course="' + c.id + '">See the lectures</button></div></div></div>';
  }).join('') + '<div class="dots" role="group" aria-label="Choose a featured course">' + featured.map(function (c, i) { return '<button type="button" aria-label="' + c.title + '"' + (i ? '' : ' class="on"') + '><i></i></button>'; }).join('') + '</div>';
  var slides = feat.querySelectorAll('.slide'), dots = feat.querySelectorAll('.dots button');
  function go(n) {
    slides[cur].classList.remove('on'); dots[cur].classList.remove('on');
    cur = (n + slides.length) % slides.length;
    slides[cur].classList.add('on'); void dots[cur].offsetWidth; dots[cur].classList.add('on');
  }
  dots.forEach(function (d, i) { d.addEventListener('click', function () { go(i); }); });
  // The dot's fill is the timer: when it finishes, the next course slides in.
  feat.addEventListener('animationend', function (e) { if (e.animationName === 'fillx' && !KM.still) go(cur + 1); });

  var tutorsEl = document.getElementById('tutors');
  tutorsEl.innerHTML = Object.keys(KM.TUTORS).map(function (k) {
    var t = KM.TUTORS[k], n = KM.COURSES.filter(function (c) { return c.tutor === k; }).length;
    return '<button class="tutorchip" type="button" data-tutor="' + k + '" aria-pressed="false">' + KM.avatar(t, 38) + '<span>' + t.name + '<small>' + n + ' courses</small></span></button>';
  }).join('');

  var SHELVES = [
    { kicker: 'Cambridge IGCSE', title: 'IGCSE courses', f: function (c) { return c.level === 'IGCSE'; } },
    { kicker: 'Cambridge International', title: 'A Level courses', f: function (c) { return c.level === 'A Level'; } },
    { kicker: 'Digital SAT', title: 'SAT preparation', f: function (c) { return c.level === 'SAT'; } },
    { kicker: 'Most students', title: 'Popular this month', f: function (c) { return c.students >= 250; } }
  ];
  var shelvesEl = document.getElementById('shelves');
  function renderShelves(tutor) {
    var list = tutor ? [{ kicker: 'Tutor', title: 'Courses with ' + KM.TUTORS[tutor].name, f: function (c) { return c.tutor === tutor; } }] : SHELVES;
    shelvesEl.innerHTML = list.map(function (s, i) {
      return '<section class="shelf"><div class="shelf-head"><div><span class="kicker">' + s.kicker + '</span><h2>' + s.title + '</h2></div>' +
        (tutor ? '<button class="btn btn-secondary btn-sm" type="button" id="alltutors">All courses</button>' : '<div class="arrows"><button type="button" data-dir="-1" aria-label="Scroll back"><svg class="flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><button type="button" data-dir="1" aria-label="Scroll on"><svg class="flip" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button></div>') +
        '</div><div class="row">' + KM.COURSES.filter(s.f).map(function (c) { return KM.card(c); }).join('') + '</div></section>';
    }).join('');
    if (!KM.still) shelvesEl.querySelectorAll('.mcard').forEach(function (el, i) { el.animate([{ opacity: 0, translate: '0 16px' }, { opacity: 1, translate: '0 0' }], { duration: 500, delay: (i % 6) * 50, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards' }); });
  }
  shelvesEl.addEventListener('click', function (e) {
    var a = e.target.closest('[data-dir]');
    if (a) { var row = a.closest('.shelf').querySelector('.row'); var dir = document.dir === 'rtl' ? -1 : 1; row.scrollBy({ left: dir * +a.dataset.dir * row.clientWidth * .8 }); }
    if (e.target.closest('#alltutors')) { tutorsEl.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); renderShelves(null); }
  });
  tutorsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true';
    tutorsEl.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(on && x === b)); });
    renderShelves(on ? b.dataset.tutor : null);
    shelvesEl.scrollIntoView({ behavior: KM.still ? 'auto' : 'smooth', block: 'start' });
  });
  renderShelves(null);
})();
</script>
</body>
</html>
